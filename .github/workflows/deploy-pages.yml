name: Deploy to GitHub Pages

# Veroeffentlicht die Web-App auf GitHub Pages, sobald ein Release
# veroeffentlicht wird. Es werden nur die tatsaechlich benoetigten
# Dateien (schematics.html, css/, js/) hochgeladen; schematics.html wird
# dabei als index.html bereitgestellt, damit die Seite unter der
# Pages-Wurzel-URL erreichbar ist.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages-Verzeichnis
        run: |
          mkdir -p pages-out
          cp schematics.html pages-out/index.html
          cp -r css pages-out/css
          cp -r js pages-out/js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
