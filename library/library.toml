# TurmericLab Schematic Library (globale Bibliothek)
#
# Die SVG-Dateien liegen in diesem Ordner (library/). Es sind ganz normale
# Exporte aus TurmericLab (SAVE bzw. DOWNLOAD im Schematic-Library-Dialog).
#
# Neues Schematic hinzufuegen:
#   1. SVG in diesen Ordner legen
#   2. Einen [[schematic]]-Block unten ergaenzen
#   3. [library] version erhoehen
#
# Schematic geaendert:
#   1. SVG ersetzen
#   2. "version" des betroffenen [[schematic]]-Blocks erhoehen
#      (Nutzer, die eine aeltere Version in ihren internen Speicher kopiert
#      haben, sehen dann den Hinweis "vX available")
#   3. [library] version erhoehen

[library]
name = "TurmericLab Schematic Library"
version = "1.4.0"   # Version der gesamten Bibliothek, bei jeder Aenderung erhoehen

[[schematic]]
file = "rc_lowpass.svg"           # Dateiname relativ zu library/
name = "RC Low-Pass Filter"       # Anzeigename im Dialog
description = "Pulse source driving a 1k / 100n RC low-pass (tau = 100 us). Transient analysis preset."
version = "1.0.0"                 # Version dieses Schematics

[[schematic]]
file = "foc_induction_motor.svg"
name = "FOC Induction Motor"
description = "Indirect rotor-field-oriented control of a 4 kW induction motor: speed PI, dq current PIs, Clarke/Park, space vector modulation, averaged inverter. Speed step at 0.1 s, load step at 0.35 s. Transient analysis preset."
version = "1.0.0"

[[schematic]]
file = "current_source.svg"
name = "Current Source Examples"
description = "Independent current source into a resistor: DC (1 mA into 1k = 1 V), pulse into 1k || 100n (RC charging, tau = 100 us), ramp, and a behavioural current source whose equation sums the three source currents from the named nets. Transient analysis preset with voltage and current probes."
version = "1.1.0"

[[schematic]]
file = "param_load_sweep.svg"
name = "Parameter Sweep: Load-Mode Current Source"
description = "DC sweep of V1 into a load-mode current source whose current is the swept parameter Il (5m 10m 20m 40m): one curve per Il, plus a vmax measurement plotted over Il in the Measurement Report."
version = "1.0.0"

[[schematic]]
file = "param_rc_sweep.svg"
name = "Parameter Sweep: RC Rise Time"
description = "RC step response with the resistor as a decade-swept parameter Rv (1k..100k). Transient family of curves plus the 10-90% rise time measurement plotted over Rv (log x) in the Measurement Report."
version = "1.0.0"
